# Prüft jeden PR automatisch: Struktur, Manifeste, verdächtige Muster.
# Läuft bewusst auf `pull_request` (read-only Token, keine Secrets) — sicher für Fork-PRs.
# Zusätzlich täglicher Security-Scan der gesamten Library (cron) — bei Fund wird ein Issue erstellt.
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Struktur und Manifeste validieren
        run: node scripts/validate-structure.mjs .

      - name: PR darf Infrastruktur nicht ändern
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=50 origin "$BASE_SHA" "$HEAD_SHA"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Geänderte Dateien:"
          echo "$CHANGED"
          BLOCKED=$(echo "$CHANGED" | grep -E '^(\.github/|scripts/)' || true)
          if [ -n "$BLOCKED" ]; then
            echo "::error::Dieser PR ändert geschützte Infrastruktur-Dateien. Skill-PRs dürfen .github/ und scripts/ nicht anfassen:"
            echo "$BLOCKED"
            exit 1
          fi

  # Täglicher Scan fehlgeschlagen → Issue für den Maintainer aufmachen
  report-scan-failure:
    needs: validate
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Issue erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "🚨 Täglicher Security-Scan fehlgeschlagen ($(date +%Y-%m-%d))" \
            --body "Der tägliche Scan der Skill-Library hat ein Problem gefunden oder konnte nicht durchlaufen.

          Bitte prüfen: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Bis zur Klärung im Zweifel den betroffenen Skill aus der marketplace.json nehmen."
