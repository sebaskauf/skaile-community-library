# Hält die Skill-Übersicht im README automatisch aktuell.
# Läuft nach jedem Merge auf main, committet nur wenn sich die Tabelle geändert hat.
name: Update README

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/marketplace.json"
      - "plugins/**"
      - "scripts/generate-readme.mjs"

permissions:
  contents: write

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: README-Tabelle generieren
        run: node scripts/generate-readme.mjs .

      - name: Committen falls geändert
        run: |
          if git diff --quiet README.md; then
            echo "README bereits aktuell"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update skill table [skip ci]"
          git push
